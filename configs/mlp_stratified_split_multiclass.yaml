dataset:
  root: ../../SurgTension
  annotations: data/annotation/tension_clip_annotations.csv
  label_mode: multiclass
  flatten: true
  require_feature: true
  include_all_clips: false
evaluation:
  classifier: mlp
  split: stratified
  k_fold: true
  n_splits: 5
  seed: 0
  output_csv: results/mlp_stratified_split_multiclass.csv
  hidden_dim: 256
  dropout: 0.3
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 100
  patience: 15
  val_fraction: 0.15
runs:
- name: slowfast_stratified_tension_level_mlp
  feature: slowfast
- name: timesformer_stratified_tension_level_mlp
  feature: timesformer
- name: video_swin_stratified_tension_level_mlp
  feature: video_swin
- name: tension_trac_tension_level_mlp
  feature: tension_trac
