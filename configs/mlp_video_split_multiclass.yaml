dataset:
  root: ../../SurgTension
  annotations: data/annotation/tension_clip_annotations.csv
  label_mode: multiclass
  flatten: true
  require_feature: true
  include_all_clips: false
evaluation:
  classifier: mlp
  split: video
  k_fold: true
  n_splits: 4
  seed: 0
  output_csv: results/mlp_video_split_multiclass.csv
  merge_video_groups:
  - - Dorsal_rectal_dissection_sample1
    - eb7a169d-024a-4756-8d62-e2f6ce160ff8_1556292
  hidden_dim: 256
  dropout: 0.3
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 100
  patience: 15
  val_fraction: 0.15
runs:
- name: slowfast_video_tension_level_mlp
  feature: slowfast
- name: timesformer_video_tension_level_mlp
  feature: timesformer
- name: video_swin_video_tension_level_mlp
  feature: video_swin
- name: tension_trac_tension_level_mlp
  feature: tension_trac
